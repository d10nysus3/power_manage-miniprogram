worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 前端静态资源服务
        location / {
            root   /usr/share/nginx/html; # 对应 docker 容器内的 dist 目录
            index  index.html index.htm;
            # SPA 路由 fallback：找不到文件时返回 index.html
            try_files $uri $uri/ /index.html;
        }

        # 解决问题1：后端 API 反向代理
        location /api/ {
            # 代理到后端服务，假设后端在 host.docker.internal 或 backend 服务名
            # 如果是 docker-compose，这里通常填 http://backend:8081
            proxy_pass http://host.docker.internal:8081/power_manage/api/;
            
            # 传递真实 IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 解决问题3：WebSocket 反向代理配置 Upgrade 头
        location /ws/ {
            proxy_pass http://host.docker.internal:8081/power_manage/ws/;
            
            proxy_http_version 1.1;
            # 关键配置：转发 Upgrade 和 Connection 头
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
