

spring.datasource.url=jdbc:mysql://localhost:3306/power_manage?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=123456

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver





spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect





server.port=8081
server.servlet.context-path=/power_manage
# 允许外部访问（重要！）
server.address=0.0.0.0





logging.level.root=INFO

logging.level.com.powermanage=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

anomaly.detection.high-threshold=10.0

anomaly.detection.low-threshold=0.1

anomaly.detection.pattern-deviation=0.3





alert.severity.critical=CRITICAL

alert.severity.high=HIGH

alert.severity.medium=MEDIUM

alert.severity.low=LOW





spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB




spring.http.encoding.charset=UTF-8

spring.http.encoding.enabled=true

spring.http.encoding.force=true



server.servlet.session.timeout=30m





spring.cache.type=simple